# Private service: reachable only through the gateway (no public URL).
# Daily news-read batch (Cron Trigger) plus on-demand and 7-day reads. Plan: docs/plans/phase3-news-agents.md
# The deploy workflow adds at deploy time (never committed):
#   [[secrets_store_secrets]] GROQ_API_KEY, SUPABASE_SERVICE_KEY  (Cloudflare Secrets Store)
#   [[secrets_store_secrets]] GEMINI_API_KEY                       (Secrets Store; only when it exists, else no Gemini trial)
#   SUPABASE_URL                                                   (from the GitHub secret SP)
#   [[kv_namespaces]] id                                           (from repository variable CF_KV_NEWSREADS)
name = "pi-newsdesk"
main = "../src/services/newsdesk.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# 40 ticks between 04:00 and 05:57 UTC, before fetch_trades at 06:00. Each tick handles 2 tickers.
[triggers]
crons = ["*/3 4,5 * * *"]

[vars]
SERVICE = "newsdesk"
GROQ_MODEL = "openai/gpt-oss-120b"
FALLBACK_API = "https://portfolio-intel-escf.onrender.com"
# Replaced at deploy from the GitHub secret SP; the placeholder fails the https://*.supabase.co check.
SUPABASE_URL = "__SUPABASE_URL__"
NEWS_CALLS_DAY = "90"
NEWS_TOKENS_DAY = "180000"
NEWS_BATCH_CALLS = "50"
NEWS_BATCH_ENABLED = "1"
NEWS_ONDEMAND_ENABLED = "1"
# Phase 5: second AI provider for news (docs/plans/phase5-news-dual-provider.md). With no GEMINI_API_KEY
# or an empty GEMINI_MODEL the Gemini slots switch off and the Worker behaves as Groq only.
NEWS_PROVIDER = "groq"           # primary for batch and on-demand: groq | gemini
NEWS_FALLBACK = "gemini"         # second provider for failover, or "" to disable
NEWS_SHADOW = "gemini"           # provider for the shadow batch, or "" to disable
NEWS_SHADOW_UNTIL = "2026-11-10" # last run_date with a shadow run (7 batch days)
GEMINI_MODEL = ""                # owner sets from Google AI Studio before the first deploy
GEMINI_CALLS_DAY = "90"
GEMINI_TOKENS_DAY = "180000"
GEMINI_BATCH_CALLS = "60"

[observability]
enabled = true
