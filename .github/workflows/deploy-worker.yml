name: Deploy API Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Offline tests
        run: |
          pip install --quiet cryptography
          TOKEN=$(python3 -c "from cryptography.fernet import Fernet; import base64,hashlib; k=base64.urlsafe_b64encode(hashlib.sha256(b'testsecret:portfolio-intel-token').digest()); print(Fernet(k).encrypt(b'access-sandbox-123').decode())")
          node test/test.mjs "$TOKEN"
      - name: Deploy to Cloudflare
        run: |
          set -o pipefail
          # Strip spaces or line breaks that sneak in when pasting secrets
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]')"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::The cf secret is empty"; exit 1; }
          echo "::notice::Token length ${#CLOUDFLARE_API_TOKEN}, account id length ${#CLOUDFLARE_ACCOUNT_ID} (expected 32)"
          npx wrangler deploy 2>&1 | tee deploy.log || {
            # Surface Cloudflare's message as an annotation so it shows on the run page
            grep -iE "error|✘|subdomain|authentication|permission|code:" deploy.log | sed 's/\x1b\[[0-9;]*m//g' | head -8 | sed 's/^/::error::/'
            exit 1
          }
          grep -oE "https://[a-z0-9.-]+\.workers\.dev" deploy.log | head -1 | sed 's/^/::notice::Worker URL /'
        env:
          CF_TOKEN_RAW: ${{ secrets.cfk || secrets.cf }}
          CF_ACCOUNT_RAW: ${{ secrets.cfkd || secrets.CLOUDFLARE_ACCOUNT_ID }}
