name: Deploy API Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Offline tests
        run: |
          pip install --quiet cryptography
          TOKEN=$(python3 -c "from cryptography.fernet import Fernet; import base64,hashlib; k=base64.urlsafe_b64encode(hashlib.sha256(b'testsecret:portfolio-intel-token').digest()); print(Fernet(k).encrypt(b'access-sandbox-123').decode())")
          node test/test.mjs "$TOKEN"
      - name: Deploy services, then the gateway
        run: |
          set -o pipefail
          # Strip spaces or line breaks that sneak in when pasting secrets
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]')"
          STORE_ID="$(printf '%s' "$CF_STORE_RAW" | tr -d '[:space:]')"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::The deploy token secret is empty"; exit 1; }
          [ ${#CLOUDFLARE_ACCOUNT_ID} -eq 32 ] || { echo "::error::The cfkd secret should be the 32-character account id (it has ${#CLOUDFLARE_ACCOUNT_ID})"; exit 1; }
          [ ${#STORE_ID} -eq 32 ] || { echo "::error::The cfks secret should be the 32-character Secrets Store id"; exit 1; }

          # Each service gets only the keys it needs, linked from the Secrets Store
          link() { f=$1; shift; for n in "$@"; do printf '\n[[secrets_store_secrets]]\nbinding = "%s"\nstore_id = "%s"\nsecret_name = "%s"\n' "$n" "$STORE_ID" "$n" >> "$f"; done; }
          link config/ai.toml GROQ_API_KEY
          link config/rates.toml GROQ_API_KEY
          link config/broker.toml PLAID_CLIENT_ID PLAID_SECRET

          # pi-newsdesk needs owner setup first (KV namespace, Secrets Store entries, Supabase URL).
          # Until all of it is in place it is skipped with a warning, and the gateway is deployed
          # without its NEWSDESK binding (news-read routes answer 503), so other deploys keep working.
          SERVICES="market news rates ai broker disclosures private"
          KV_ID="$(printf '%s' "$CF_KV_NEWSREADS_RAW" | tr -d '[:space:]')"
          SB_URL="$(printf '%s' "$SB_URL_RAW" | tr -d '[:space:]' | sed -E 's#/+$##; s#/rest/v1$##')"
          newsdesk_skip=""
          if ! printf '%s' "$KV_ID" | grep -qE '^[0-9a-f]{32}$'; then
            newsdesk_skip="repository variable CF_KV_NEWSREADS is missing or is not a 32-character hex KV namespace id"
          elif ! printf '%s' "$SB_URL" | grep -qE '^https://[a-z0-9-]+\.supabase\.co$'; then
            newsdesk_skip="GitHub secret SP is missing or is not an https://<project>.supabase.co URL"
          else
            names="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores/$STORE_ID/secrets?per_page=100" \
              | jq -r '.result[]?.name' 2>/dev/null)" || names=""
            # The Supabase key may be stored as SUPABASE_SERVICE_KEY or SUPABASE_SERVICE_ROLE_KEY
            SB_SECRET=""
            for n in SUPABASE_SERVICE_KEY SUPABASE_SERVICE_ROLE_KEY; do printf '%s\n' "$names" | grep -qx "$n" && { SB_SECRET=$n; break; }; done
            if ! printf '%s\n' "$names" | grep -qx GROQ_API_KEY; then
              newsdesk_skip="Secrets Store has no GROQ_API_KEY (or the deploy token cannot list the store: add Account > Secrets Store: Read)"
            elif [ -z "$SB_SECRET" ]; then
              newsdesk_skip="Secrets Store has no SUPABASE_SERVICE_KEY or SUPABASE_SERVICE_ROLE_KEY (or the deploy token cannot list the store: add Account > Secrets Store: Read)"
            fi
          fi
          if [ -n "$newsdesk_skip" ]; then
            echo "::warning::Skipping pi-newsdesk: $newsdesk_skip. News reads stay off (503) until setup is done; see docs/plans/phase3-news-agents.md section 16."
            sed -i '/binding = "NEWSDESK"/d' wrangler.toml
          else
            link config/newsdesk.toml GROQ_API_KEY
            printf '\n[[secrets_store_secrets]]\nbinding = "SUPABASE_SERVICE_KEY"\nstore_id = "%s"\nsecret_name = "%s"\n' "$STORE_ID" "$SB_SECRET" >> config/newsdesk.toml
            sed -i "s#__SUPABASE_URL__#$SB_URL#" config/newsdesk.toml
            printf '\n[[kv_namespaces]]\nbinding = "NEWSREADS"\nid = "%s"\n' "$KV_ID" >> config/newsdesk.toml
            SERVICES="$SERVICES newsdesk"
          fi

          deploy() {
            npx wrangler deploy "$@" 2>&1 | tee deploy.log || {
              grep -iE "error|✘|permission|code:" deploy.log | sed 's/\x1b\[[0-9;]*m//g' | head -6 | sed "s/^/::error::[$*] /"
              exit 1
            }
          }
          for svc in $SERVICES; do
            deploy -c config/$svc.toml
            echo "::notice::Deployed pi-$svc (private)"
          done
          deploy
          grep -oE "https://[a-z0-9.-]+\.workers\.dev" deploy.log | head -1 | sed 's/^/::notice::Gateway URL /'
        env:
          CF_TOKEN_RAW: ${{ secrets.cfk || secrets.cf }}
          CF_ACCOUNT_RAW: ${{ secrets.cfkd }}
          CF_STORE_RAW: ${{ secrets.cfks }}
          CF_KV_NEWSREADS_RAW: ${{ vars.CF_KV_NEWSREADS }}
          SB_URL_RAW: ${{ secrets.SP }}
