name: Secrets Store check

on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: What the deploy token can see (names and scopes only, never values)
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]')"
          STORE_ID="$(printf '%s' "$CF_STORE_RAW" | tr -d '[:space:]')"
          strip() { sed 's/\x1b\[[0-9;]*m//g'; }
          npx wrangler whoami 2>&1 | strip | grep -iE "secrets|workers|token|Account" | head -20 | sed 's/^/::notice::whoami: /'
          npx wrangler secrets-store store list --remote 2>&1 | strip | grep -vE "^\s*$" | head -10 | sed "s/$STORE_ID/[cfks]/g; s/^/::notice::stores: /"
          npx wrangler secrets-store secret list "$STORE_ID" --remote 2>&1 | strip | grep -vE "^\s*$" | head -15 | sed "s/$STORE_ID/[cfks]/g; s/^/::notice::secrets: /"
        env:
          CF_TOKEN_RAW: ${{ secrets.cfk || secrets.cf }}
          CF_ACCOUNT_RAW: ${{ secrets.cfkd }}
          CF_STORE_RAW: ${{ secrets.cfks }}
