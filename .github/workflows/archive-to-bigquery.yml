name: Archive to BigQuery (one-time)

# Loads trades and prices already collected by a history backfill run into BigQuery only
# (Supabase is skipped, so it doesn't fill up again). Artifacts are kept for 7 days.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Backfill run id whose collected data to load'
        required: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: trades-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/836427336290/locations/global/workloadIdentityPools/github/providers/repo
          service_account: portfolio-intel-bq@portfolio-intel-512216.iam.gserviceaccount.com
      - name: Load into BigQuery
        env:
          BQ_PROJECT: ${{ secrets.BQP || 'portfolio-intel-512216' }}
        run: |
          pip install --quiet requests google-cloud-bigquery
          ls trades_*.json
          python3 scripts/history_load.py --trades trades_*.json --prices 5y
