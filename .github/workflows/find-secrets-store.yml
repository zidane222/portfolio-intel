name: Find Secrets Store ID

on: workflow_dispatch

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: List stores (IDs are not secret)
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]')"
          npx wrangler secrets-store store list --remote 2>&1 | tee out.log || true
          sed 's/\x1b\[[0-9;]*m//g' out.log | grep -E "[0-9a-f]{32}|ERROR|permission|Authentication" | head -8 | sed 's/^/::notice::/'
        env:
          CF_TOKEN_RAW: ${{ secrets.cfk || secrets.cf }}
          CF_ACCOUNT_RAW: ${{ secrets.cfkd }}
