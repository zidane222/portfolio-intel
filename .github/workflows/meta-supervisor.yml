name: Meta supervisor

on:
  schedule:
    - cron: '10 14 * * *'   # 14:10 UTC daily
  workflow_dispatch:

permissions:
  contents: read   # workflow default; the commit job raises it for itself only

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # check F: SOC monitor heartbeat
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: cd worker && npm ci

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Unit tests
        run: python3 -m unittest scripts/test_meta_supervisor.py scripts/test_news_provider_compare.py

      - name: News provider comparison
        # Phase 5 trial. Writes nothing and exits 0 if Supabase is unreachable
        env:
          SUPABASE_URL: ${{ secrets.SP }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SR }}
        run: python3 scripts/news_provider_compare.py

      - name: Run meta supervisor
        # Secrets only on this step, not on npm ci or pip install
        env:
          SUPABASE_URL: ${{ secrets.SP }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          cfk: ${{ secrets.cfk || secrets.cf }}   # check E: read-only Cloudflare telemetry, as the SOC monitor
          cfkd: ${{ secrets.cfkd }}
        run: python3 scripts/meta_supervisor.py

      - name: Upload news_provider_compare.json
        uses: actions/upload-artifact@v4
        with:
          name: news-provider-compare
          path: news_provider_compare.json
          if-no-files-found: ignore
          retention-days: 1

  commit:
    # Write job, split from the install job (same pattern as CONTROLS C-41): no installs, no secrets except the repo token.
    needs: supervise
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: meta-supervisor-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true   # no artifact when Supabase was unreachable; the next step then exits 0
        with:
          name: news-provider-compare
          path: artifact

      - name: Commit news_provider_compare.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f artifact/news_provider_compare.json ] || { echo "No comparison file, nothing to commit"; exit 0; }
          cp artifact/news_provider_compare.json news_provider_compare.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news_provider_compare.json
          # the script keeps "generated" when nothing else changed, so an unchanged result is no diff
          if git diff --staged --quiet; then exit 0; fi
          git commit -q -m "Auto-update news provider comparison $(date -u '+%Y-%m-%d')"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            echo "::warning::Push attempt $i failed, retrying"; sleep $((i * 10))
          done
          echo "::error::Could not push news_provider_compare.json after 3 attempts"; exit 1
