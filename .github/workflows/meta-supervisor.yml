name: Meta supervisor

on:
  schedule:
    - cron: '10 14 * * *'   # 14:10 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # check F: SOC monitor heartbeat
  issues: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: cd worker && npm ci

      - name: Install Python dependencies
        run: pip install requests

      - name: Unit tests
        run: python3 -m unittest scripts/test_meta_supervisor.py

      - name: Run meta supervisor
        # Secrets only on this step, not on npm ci or pip install
        env:
          SUPABASE_URL: ${{ secrets.SP }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          cfk: ${{ secrets.cfk || secrets.cf }}   # check E: read-only Cloudflare telemetry, as the SOC monitor
          cfkd: ${{ secrets.cfkd }}
        run: python3 scripts/meta_supervisor.py
