name: SOC monitor

on:
  schedule:
    - cron: '15 13 * * *'   # 13:15 UTC daily, after fetch_trades (06:00) and private-markets (11:30)
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  security-events: read   # code scanning alert count (skipped gracefully if unreadable)

concurrency:
  group: soc-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Unit tests
        run: python3 -m unittest scripts/test_soc_monitor.py
      - name: Run monitor (read-only checks, opens or closes one issue)
        env:
          SP: ${{ secrets.SP }}
          SR: ${{ secrets.SR }}
          cfk: ${{ secrets.cfk || secrets.cf }}
          cfkd: ${{ secrets.cfkd }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/soc_monitor.py
