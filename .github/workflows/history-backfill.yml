name: History backfill (one-time)

# Run from the Actions tab: loads past years of House trades and 5 years of daily prices
# into Supabase (rolling 5 years) and BigQuery (full archive). Safe to run again; rows are merged.
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Filing years, space separated'
        default: '2021 2022 2023 2024 2025 2026'
      prices:
        description: 'Price range: 5y, or max for a one-time full reload (fills adj_close for all history)'
        type: choice
        options: ['5y', 'max']
        default: '5y'
      replace_senate:
        description: 'Clear Senate rows in Supabase before loading (use after a Senate fix)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.y.outputs.years }}
    steps:
      - id: y
        run: echo "years=$(echo '${{ github.event.inputs.years }}' | tr -s ' ' '\n' | grep -E '^20[0-9]{2}$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: ${{ fromJson(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4 lxml pdfplumber
      - run: python3 scripts/house_ptr.py --year ${{ matrix.year }} --out trades_${{ matrix.year }}.json --plain
      - uses: actions/upload-artifact@v4
        with:
          name: trades-${{ matrix.year }}
          path: trades_${{ matrix.year }}.json
          retention-days: 7

  senate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4
      - run: python3 scripts/senate_ptr.py --since "$(echo '${{ github.event.inputs.years }}' | tr -s ' ' '\n' | grep -E '^20[0-9]{2}$' | sort | head -1)-01-01" --out trades_senate.json
      - uses: actions/upload-artifact@v4
        with:
          name: trades-senate
          path: trades_senate.json
          retention-days: 7

  load:
    needs: [scrape, senate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_GCP: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: trades-*
          merge-multiple: true
      - name: Google Cloud sign-in
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/836427336290/locations/global/workloadIdentityPools/github/providers/repo
          service_account: portfolio-intel-bq@portfolio-intel-512216.iam.gserviceaccount.com
      - name: Load history
        env:
          SUPABASE_URL: ${{ secrets.SP }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SR }}
          BQ_PROJECT: ${{ secrets.BQP || 'portfolio-intel-512216' }}
        run: |
          pip install --quiet requests google-cloud-bigquery
          ls trades_*.json
          python3 scripts/history_load.py --trades trades_*.json --prices ${{ github.event.inputs.prices || '5y' }} ${{ github.event.inputs.replace_senate == 'true' && '--replace-chamber senate' || '' }}
